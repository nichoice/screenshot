name: macOS CI

"on":
  push:
    branches:
      - main
      - "feat/**"
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Run tests
        run: make test

      - name: Build debug app
        run: |
          xcodebuild \
            -project ScreenshotTool.xcodeproj \
            -scheme ScreenshotTool \
            -configuration Debug \
            -derivedDataPath .build/xcode \
            build
