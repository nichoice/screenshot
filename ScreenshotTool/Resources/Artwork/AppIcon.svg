      <stop offset="0.64" stop-color="#6ABEFF"/>
      <stop offset="1" stop-color="#1D5FDB"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(742 245) rotate(130) scale(540 460)">
      <stop offset="0" stop-color="#FFE9A6" stop-opacity="0.98"/>
      <stop offset="0.42" stop-color="#7EF7D4" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#2E6DEB" stop-opacity="0"/>
