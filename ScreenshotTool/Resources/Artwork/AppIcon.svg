<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ScreenshotTool App Icon</title>
  <desc id="desc">A liquid glass macOS icon showing a screenshot selection frame, annotation pen, cursor, and confirmation glow.</desc>
  <defs>
